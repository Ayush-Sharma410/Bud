<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bud Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* --- Companion Cursor --- */
    #cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease;
      filter: drop-shadow(0 2px 8px rgba(66, 133, 244, 0.4));
    }

    #cursor svg {
      width: 100%;
      height: 100%;
    }

    /* --- Response Bubble --- */
    #response-bubble {
      position: fixed;
      bottom: 90px;
      right: 40px;
      max-width: 400px;
      padding: 16px 20px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 13px;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    #response-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- Spinner (processing) --- */
    #spinner {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 999;
      pointer-events: none;
    }

    #spinner.active {
      opacity: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Companion Cursor -->
  <div id="cursor">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4L24 14L14 16L10 24L4 4Z" fill="#4285F4" stroke="#fff" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- Processing Spinner -->
  <div id="spinner"></div>

  <!-- Response Text Bubble -->
  <div id="response-bubble"></div>

  <!-- Agent Annotations -->
  <div id="annotations" style="position:fixed; inset:0; pointer-events:none; z-index:900;"></div>

  <script src="annotationRenderer.js"></script>
  <script>
    const cursor = document.getElementById('cursor');
    const spinner = document.getElementById('spinner');
    const responseBubble = document.getElementById('response-bubble');

    let touring = false;
    let tourCancelToken = 0;
    let lastMouseX = window.innerWidth / 2;
    let lastMouseY = window.innerHeight / 2;
    let currentFlyToken = 0;

    document.addEventListener('mousemove', (e) => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (touring) return;
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function flyCursorTo(endX, endY, duration) {
      const myToken = ++currentFlyToken;
      return new Promise((resolve) => {
        const rect = cursor.getBoundingClientRect();
        const startX = rect.left;
        const startY = rect.top;

        const midX = (startX + endX) / 2;
        const midY = (startY + endY) / 2;
        const dx = endX - startX;
        const dy = endY - startY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const nx = -dy / (distance || 1);
        const ny = dx / (distance || 1);
        const offset = distance * 0.25;
        const ctrlX = midX + nx * offset;
        const ctrlY = midY + ny * offset;

        const startTime = performance.now();

        function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function animate(now) {
          if (myToken !== currentFlyToken) { resolve(); return; }
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / (duration || 800), 1);
          const t = ease(progress);
          const u = 1 - t;
          cursor.style.left = (u * u * startX + 2 * u * t * ctrlX + t * t * endX) + 'px';
          cursor.style.top = (u * u * startY + 2 * t * u * ctrlY + t * t * endY) + 'px';
          const tx = 2 * u * (ctrlX - startX) + 2 * t * (endX - ctrlX);
          const ty = 2 * u * (ctrlY - startY) + 2 * t * (endY - ctrlY);
          cursor.style.transform = 'rotate(' + (Math.atan2(ty, tx) * (180 / Math.PI) + 45) + 'deg)';
          if (progress < 1) { requestAnimationFrame(animate); }
          else { cursor.style.transform = 'none'; resolve(); }
        }
        requestAnimationFrame(animate);
      });
    }

    function cancelTour() {
      tourCancelToken++;
      touring = false;
    }

    window.budCursorTour = async function (points) {
      if (!points || points.length === 0) return;
      cancelTour();
      const myToken = tourCancelToken;
      touring = true;
      for (let i = 0; i < points.length; i++) {
        if (myToken !== tourCancelToken) return;
        await flyCursorTo(points[i].x, points[i].y, 800);
        if (myToken !== tourCancelToken) return;
        await sleep(i < points.length - 1 ? 1200 : 500);
        if (myToken !== tourCancelToken) return;
      }
      if (myToken !== tourCancelToken) return;
      touring = false;
      cursor.style.opacity = '0';
      await sleep(300);
      if (myToken !== tourCancelToken) return;
      cursor.style.left = lastMouseX + 'px';
      cursor.style.top = lastMouseY + 'px';
      cursor.style.opacity = '1';
    };

    window.budCursorCancelTour = cancelTour;

    let currentAudio = null;

    if (window.budAPI) {
      window.budAPI.onPushToTalkStart(() => {
        spinner.classList.remove('active');
        responseBubble.classList.remove('visible');
        if (currentAudio) {
          currentAudio.pause();
          URL.revokeObjectURL(currentAudio.src);
          currentAudio = null;
          window.budAPI.audioPlaybackEnded();
        }
      });

      window.budAPI.onPushToTalkEnd(() => {
        spinner.classList.add('active');
      });

      window.budAPI.onStateChange((state) => {
        spinner.classList.remove('active');

        switch (state) {
          case 'processing':
            spinner.classList.add('active');
            break;

          case 'responding':
            if (currentAudio) {
              currentAudio.pause();
              URL.revokeObjectURL(currentAudio.src);
              currentAudio = null;
              window.budAPI.audioPlaybackEnded();
            }
            break;
        }
      });

      window.budAPI.onResponse((text) => {
        responseBubble.textContent = text;
        responseBubble.classList.add('visible');
        spinner.classList.remove('active');
        setTimeout(() => {
          responseBubble.classList.remove('visible');
        }, 10000);
      });

      window.budAPI.onPointTo((data) => {
        cancelTour();
        flyCursorTo(data.x, data.y, 800);
      });

      window.budAPI.onToggleCursor((enabled) => {
        cursor.style.display = enabled ? 'block' : 'none';
      });

      // Get initial cursor visibility state
      window.budAPI.getStatus().then((status) => {
        if (status && status.settings) {
          cursor.style.display = status.settings.cursorEnabled ? 'block' : 'none';
        }
      });

      // --- Audio Playback (TTS) ---
      window.budAPI.onPlayAudio((base64) => {
        try {
          // Convert base64 WAV to blob URL and play
          const binaryString = atob(base64);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const blob = new Blob([bytes], { type: 'audio/wav' });
          const url = URL.createObjectURL(blob);

          if (currentAudio) {
            currentAudio.pause();
            URL.revokeObjectURL(currentAudio.src);
          }

          currentAudio = new Audio(url);
          currentAudio.onended = () => {
            URL.revokeObjectURL(url);
            currentAudio = null;
            window.budAPI.audioPlaybackEnded();
          };
          currentAudio.onerror = (err) => {
            console.error('Audio playback error:', err);
            URL.revokeObjectURL(url);
            currentAudio = null;
            window.budAPI.audioPlaybackEnded();
          };
          currentAudio.play().catch(err => {
            console.error('Audio playback failed to start (e.g. autoplay blocked):', err);
            URL.revokeObjectURL(url);
            currentAudio = null;
            window.budAPI.audioPlaybackEnded();
          });
        } catch (err) {
          console.error('Failed to play audio:', err);
          window.budAPI.audioPlaybackEnded();
        }
      });

      window.budAPI.onStopAudio(() => {
        if (currentAudio) {
          currentAudio.pause();
          URL.revokeObjectURL(currentAudio.src);
          currentAudio = null;
          window.budAPI.audioPlaybackEnded();
        }
      });
    }
  </script>
</body>
</html>
