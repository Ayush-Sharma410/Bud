<!DOCTYPE html>
<html>
<head>
  <title>Bud Audio Recorder</title>
</head>
<body>
  <script>
    let audioContext;
    let mediaStream;
    let workletNode;
    
    async function initAudio() {
      try {
        // Request microphone access
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        
        // Create audio context at 24kHz
        audioContext = new AudioContext({ sampleRate: 24000 });
        
        // Load the AudioWorklet
        await audioContext.audioWorklet.addModule('realtime-worklet.js');
        
        // Create source from microphone
        const source = audioContext.createMediaStreamSource(mediaStream);
        
        // Create worklet node
        workletNode = new AudioWorkletNode(audioContext, 'pcm16-processor');
        
        // Forward PCM chunks to main process
        workletNode.port.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            const base64 = arrayBufferToBase64(event.data);
            window.budAPI.sendRealtimePCM(base64);
          }
        };
        
        // Connect: microphone → worklet
        source.connect(workletNode);
        
        console.log('🎤 Audio capture started');
      } catch (err) {
        console.error('❌ Audio capture failed:', err);
      }
    }
    
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
    
    // Start audio capture when window loads
    window.addEventListener('load', () => {
      initAudio();
    });
    
    // Handle cleanup
    window.addEventListener('beforeunload', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
    });
  </script>
</body>
</html>
